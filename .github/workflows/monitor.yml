name: qnyz-monitor

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一组失败不影响另一组
      matrix:
        include:
        - name: nov06
          config: config.stay.06.yaml
        - name: nov07
          config: config.stay.07.yaml
        - name: nov08
          config: config.stay.08.yaml
        - name: nov09
          config: config.stay.09.yaml
        - name: nov10
          config: config.stay.10.yaml
        - name: nov11
          config: config.stay.11.yaml
        - name: nov12
          config: config.stay.12.yaml
        - name: nov13
          config: config.stay.13.yaml
        - name: nov14
          config: config.stay.14.yaml
        - name: nov15
          config: config.stay.15.yaml
        - name: nov16
          config: config.stay.16.yaml
        - name: nov17
          config: config.stay.17.yaml
        - name: nov18
          config: config.stay.18.yaml
        - name: nov19
          config: config.stay.19.yaml
        - name: nov20
          config: config.stay.20.yaml
    name: check-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      # 每组独立的去重缓存（key 前缀含组名，互不覆盖）
      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.name }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --strict --once --config ${{ matrix.config }}
